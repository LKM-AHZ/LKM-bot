name: LKMBot Dashboard CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    if: github.repository == 'AstrBotDevs/AstrBot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Check i18n keys
        working-directory: dashboard
        run: pnpm run i18n:check

      - name: Install and Build
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Inject Commit SHA
        id: get_sha
        run: |
          # 写进 $GITHUB_ENV 只对「后续步骤」生效，本步骤的 shell 里 $COMMIT_SHA 还是空的，
          # 于是 version 文件会被写成空行；这里直接用变量。
          sha="$(git rev-parse HEAD)"
          echo "COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          mkdir -p dashboard/dist/assets
          echo "$sha" > dashboard/dist/assets/version
          cd dashboard
          zip -r dist.zip dist

      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-without-markdown
          path: |
            dashboard/dist
            !dashboard/dist/**/*.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: release-${{ github.sha }}
          owner: AstrBotDevs
          repo: astrbot-release-harbour
          body: "Automated release from commit ${{ github.sha }}"
          token: ${{ secrets.ASTRBOT_HARBOUR_TOKEN }}
          artifacts: "dashboard/dist.zip"
