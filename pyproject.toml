[project]
name = "LKMBot"
version = "0.1.0"
description = "Easy-to-use multi-platform LLM chatbot and development framework"
readme = "README.md"
# PEP 639：用 SPDX 表达式替代旧式 { text = ... } 表（后者会触发 hatchling 的弃用提示），
# 并显式声明许可证文件，打包时的许可元数据才完整
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"

keywords = ["LKMBot", "LKM", "Agent", "Chatbot", "IM"]

dependencies = [
  "aiocqhttp>=1.4.4",
  "aiodocker>=0.24.0",
  "aiohttp>=3.11.18",
  "aiosqlite>=0.21.0",
  "anthropic>=0.51.0",
  "apscheduler>=3.11.0",
  "certifi>=2025.4.26",
  "chardet~=5.1.0",
  "loguru>=0.7.2",
  "cryptography>=44.0.3",
  "dashscope>=1.23.2",
  "deprecated>=1.2.18",
  "dingtalk-stream>=0.22.1",
  "docstring-parser>=0.16",
  "faiss-cpu>=1.14.3",
  "fastapi>=0.124.0",
  "filelock>=3.18.0",
  "google-genai>=1.56.0",
  "httpx[socks]>=0.28.1",
  "lark-oapi>=1.4.15",
  "mcp>=1.8.0,<2",
  "openai>=1.78.0",
  "ormsgpack>=1.9.1",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "pillow>=11.2.1",
  "pip>=25.1.1",
  "psutil>=5.8.0,<7.2.0",
  "py-cord>=2.6.1",
  "pydantic>=2.12.5",
  "pydub>=0.25.1",
  "pyjwt>=2.10.1",
  "qrcode>=8.2",
  "quart>=0.20.0",
  "python-telegram-bot>=22.6",
  "qq-botpy==1.2.1",
  "silk-python>=0.2.6",
  "slack-sdk>=3.35.0",
  "sqlalchemy[asyncio]>=2.0.41",
  "sqlmodel>=0.0.24",
  "telegramify-markdown>=1.0.0",
  "watchfiles>=1.0.5",
  "websockets>=15.0.1",
  "wechatpy>=1.8.18",
  "audioop-lts ; python_full_version >= '3.13'",
  "click>=8.2.1",
  "pypdf>=6.1.1",
  "aiofiles>=25.1.0",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "markitdown-no-magika[docx,xls,xlsx]>=0.1.2",
  # 下界取 uv.lock 中已验证的版本：pip 安装路径（coverage_test.yml）不经 lock，无约束会取到任意新版
  "xinference-client>=3.4.0",
  "tenacity>=9.1.2",
  "shipyard-python-sdk>=0.2.4",
  "shipyard-neo-sdk>=0.2.0",
  "python-socks>=2.8.0",
  "pysocks>=1.7.1",
  "packaging>=24.2",
  "python-ripgrep==0.0.8 ; python_version < '3.14'",
  "python-docx>=1.2.0",
  "pyotp>=2.9.0",
  "reportlab>=5.0.0",
  "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
  "commitizen>=4.9.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.1",
  "pytest-xdist>=3.8.0",
  "ruff==0.15.22",
  "ty==0.0.70",
]

[project.scripts]
lkmbot = "astrbot.cli.__main__:cli"
astrbot = "astrbot.cli.__main__:cli"

[project.urls]
Repository = "https://github.com/Alma1314/LKM-bot"

[tool.ruff]
exclude = ["astrbot/core/utils/t2i/local_strategy.py", "astrbot/api/all.py", "tests"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
  "I",     # import-order
  "UP",    # pyupgrade
  # "SIM", # flake8-simplify 
]
ignore = [
  "F403",
  "F405",
  "E501",
]

# 豁免只给上游 astrbot/ 目录，不再全局关闭：
# - ASYNC230/ASYNC240（阻塞式文件 I/O）：待上游迁移，本仓不改上游代码（实测全仓命中都在 astrbot/）；
# - UP*/ASYNC109：target-version 已随运行期门槛提到 py312，而上游树仍是 py310 写法（PEP695 泛型、
#   datetime.UTC 等），全量迁移要改上游文件。
# 自研文件（main.py / scripts/ 等）不受豁免，新代码仍按 3.12 口径被拦截。
[tool.ruff.lint.per-file-ignores]
"astrbot/**" = [
  "ASYNC109",
  "ASYNC230",
  "ASYNC240",
  "UP017",
  "UP035",
  "UP036",
  "UP040",
  "UP041",
  "UP042",
  "UP046",
  "UP047",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportMissingImports = false
include = ["astrbot"]
exclude = ["dashboard", "node_modules", "dist", "data", "tests"]

# ty（CI 硬门禁：`uv run ty check .` 必须 0 诊断且退出码 0）
[tool.ty.environment]
# 与 .python-version / requires-python 对齐，避免 ty 默认版本带来的口径漂移
python-version = "3.12"

# 排除范围与 pyright 的 exclude 保持一致（ruff 侧由 respect-gitignore 默认跳过同一批目录）：
# 测试代码不纳入静态类型检查——测试里大量 mock/替身（SimpleNamespace / MagicMock / 裸 dict 赋给
# 有类型属性）会产生上千条与真实缺陷无关的诊断，要"修"它们只能靠加宽注解或强转，反而弱化类型；
# 其余目录是前端产物/依赖/运行期数据，可能混入生成的 Python，pyright 也不看。
[tool.ty.src]
exclude = ["tests", "dashboard", "node_modules", "dist", "data"]

[tool.ty.rules]
# 放宽项一律下移到 [[tool.ty.overrides]] 按目录收窄，不放全局：全局关掉等于以后新代码里的
# 同类问题也永远不报（本仓的 `# type: ignore` 全在 astrbot/ 这棵上游树里）。

# 上游树的 `# type: ignore` 是给 pyright 写的（本仓库 pyright 仍是配置中的检查器）。
# ty 判定"未使用"并不代表 pyright 也不再需要 → 保留注释本身，只在 ty 侧对这批文件关掉该提示，
# 否则每条都会让 `ty check` 以非零码退出。
[[tool.ty.overrides]]
include = ["astrbot/**"]

[tool.ty.overrides.rules]
unused-type-ignore-comment = "ignore"

[tool.hatch.metadata]
allow-direct-references = true

# Include bundled dashboard dist even though it is not tracked by VCS.
[tool.hatch.build]
artifacts = ["astrbot/dashboard/dist/**"]

# 显式声明要打包的目录：项目名（LKMBot）与源码目录（astrbot/）在改名后不再一致，
# hatchling 的默认启发式（按项目名找同名目录）会找不到包 → 构建 wheel 直接失败：
#   ValueError: Unable to determine which files to ship ...
# 后果是 `uv sync`（含 .github/workflows/code-format.yml）不可用。
[tool.hatch.build.targets.wheel]
packages = ["astrbot"]

# Custom build hook: builds the Vue dashboard and copies dist into the package.
[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[build-system]
# 下界是 PEP 639（license/license-files 的 SPDX 形式）所需的版本；不设下界时
# 未来某次 hatchling 大版本变更会在本仓零改动的情况下弄坏 uv sync / wheel 构建
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
