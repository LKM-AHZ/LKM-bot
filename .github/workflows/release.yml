name: Release LKMBot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/SHA)"
        required: false
        default: "master"
      tag:
        description: "Release tag to publish assets to (for example: v4.14.6)"
        required: false

# 最小权限：工作流默认只读，只有真正要写 Release 的 publish-release 单独提权。
# 否则 build-dashboard 里的第三方 action 与 `curl | bash` 安装步骤都会继承 contents: write。
permissions:
  contents: read

jobs:
  build-dashboard:
    name: Build Dashboard
    if: github.repository == 'AstrBotDevs/AstrBot'
    runs-on: ubuntu-24.04
    env:
      # 只把「是否配置了 R2」这一布尔量下发给全部步骤；真凭据只在 upload 步骤的 env 里出现，
      # 避免被 pnpm/setup-node 等第三方 action 与上面的安装脚本读到。
      HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
      # workflow_dispatch 的 tag 输入是不可信字符串：经 env 传入、由 shell 变量展开，
      # 不能把 ${{ inputs.tag }} 直接写进 run 脚本（会注入 shell 语法）。
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          if [ -z "$tag" ]; then
            echo "Failed to resolve tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build dashboard dist
        shell: bash
        working-directory: dashboard
        env:
          # 解析出的 tag 同样来自不可信输入（inputs.tag 或 git ref 名），run 脚本里一律走 env
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          echo "$TAG" > dist/assets/version
          # 资产名须与 astrbot/core/dashboard_assets.py 的回退 URL、面板 404 页提示
          # （dashboard/services/static_file_service.py）保持一致，否则自动安装会 404
          zip -r "LKMBot-$TAG-dashboard.zip" dist

      - name: Build core package
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git archive \
            --format=zip \
            --prefix="AstrBot-$TAG/" \
            --output="AstrBot-$TAG-core.zip" \
            HEAD

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dashboard-${{ steps.tag.outputs.tag }}
          if-no-files-found: error
          path: dashboard/LKMBot-${{ steps.tag.outputs.tag }}-dashboard.zip

      - name: Upload release packages to Cloudflare R2
        if: env.HAS_R2 == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: "astrbot"
          DASHBOARD_LATEST_OBJECT_NAME: "astrbot-webui-latest.zip"
          CORE_LATEST_OBJECT_NAME: "astrbot-core-latest.zip"
          VERSION_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          # 不再 `curl https://rclone.org/install.sh | sudo bash`：那是把未固定版本的远端脚本
          # 以 root 执行。改为固定版本 + 校验官方发布的 sha256 后再装。
          rclone_version=1.75.1
          curl -fsSLO "https://downloads.rclone.org/v${rclone_version}/rclone-v${rclone_version}-linux-amd64.zip"
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone-v${rclone_version}-linux-amd64.zip" | sha256sum -c -
          unzip -q "rclone-v${rclone_version}-linux-amd64.zip"
          sudo install -m 0755 "rclone-v${rclone_version}-linux-amd64/rclone" /usr/local/bin/rclone

          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          EOF

          cp "dashboard/LKMBot-${VERSION_TAG}-dashboard.zip" "dashboard/${DASHBOARD_LATEST_OBJECT_NAME}"
          rclone copy "dashboard/${DASHBOARD_LATEST_OBJECT_NAME}" "r2:${R2_BUCKET_NAME}" --progress
          cp "dashboard/LKMBot-${VERSION_TAG}-dashboard.zip" "dashboard/astrbot-webui-${VERSION_TAG}.zip"
          rclone copy "dashboard/astrbot-webui-${VERSION_TAG}.zip" "r2:${R2_BUCKET_NAME}" --progress

          cp "AstrBot-${VERSION_TAG}-core.zip" "${CORE_LATEST_OBJECT_NAME}"
          rclone copy "${CORE_LATEST_OBJECT_NAME}" "r2:${R2_BUCKET_NAME}" --progress
          cp "AstrBot-${VERSION_TAG}-core.zip" "astrbot-core-${VERSION_TAG}.zip"
          rclone copy "astrbot-core-${VERSION_TAG}.zip" "r2:${R2_BUCKET_NAME}" --progress
          rclone copyto "AstrBot-${VERSION_TAG}-core.zip" "r2:${R2_BUCKET_NAME}/astrbot-core/${VERSION_TAG}/source.zip" --progress
          rclone copyto "AstrBot-${VERSION_TAG}-core.zip" "r2:${R2_BUCKET_NAME}/download/astrbot-core/${VERSION_TAG}/source.zip" --progress

  publish-release:
    name: Publish GitHub Release
    if: github.repository == 'AstrBotDevs/AstrBot'
    runs-on: ubuntu-24.04
    # 只有这个 job 需要写仓库内容（建/改 Release、传资产）
    permissions:
      contents: write
    needs:
      - build-dashboard
    env:
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          if [ -z "$tag" ]; then
            echo "Failed to resolve tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download dashboard artifact
        uses: actions/download-artifact@v8
        with:
          name: Dashboard-${{ steps.tag.outputs.tag }}
          path: release-assets


      - name: Resolve release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          note_file="changelogs/$TAG.md"
          if [ ! -f "$note_file" ]; then
            note_file="$(mktemp)"
            echo "Release $TAG" > "$note_file"
          fi
          echo "file=$note_file" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          tag="$TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # tag 不存在时 gh release create 会从默认分支 HEAD 现建一个 tag，
            # 于是 release 指向的位置与实际构建来源（inputs.ref）不一致。先确认 tag 已存在。
            if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag does not exist; refusing to create a tag/release pointing at the default branch." >&2
              exit 1
            fi
            gh release create "$tag" --title "$tag" --notes-file "${{ steps.notes.outputs.file }}"
          fi

      - name: Remove stale assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          tag="$TAG"
          while IFS= read -r asset; do
            case "$asset" in
              # 只删本工作流紧接着会重新上传的那一个资产。原先的 *.zip|*.exe|*.AppImage|...
              # 会把本工作流并不产出的资产一并删掉（core 包只进 R2，从不作为 release 资产上传），
              # 删了没有任何东西能补回来。
              LKMBot-*-dashboard.zip)
                gh release delete-asset "$tag" "$asset" -y || true
                ;;
            esac
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          tag="$TAG"
          gh release upload "$tag" release-assets/* --clobber

  publish-pypi:
    name: Publish PyPI
    if: github.repository == 'AstrBotDevs/AstrBot'
    runs-on: ubuntu-24.04
    needs:
      - publish-release
    env:
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          if [ -z "$tag" ]; then
            echo "Failed to resolve tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download dashboard artifact
        uses: actions/download-artifact@v8
        with:
          name: Dashboard-${{ steps.tag.outputs.tag }}
          path: ${{ runner.temp }}/dashboard-artifact

      - name: Unpack dashboard dist into package tree
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p astrbot/dashboard/dist
          unzip -q "${RUNNER_TEMP}/dashboard-artifact/LKMBot-$TAG-dashboard.zip" -d "${RUNNER_TEMP}/dashboard-artifact/unpacked"
          cp -r "${RUNNER_TEMP}/dashboard-artifact/unpacked/dist/." astrbot/dashboard/dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 与 .python-version / requires-python(>=3.12) 对齐：在 3.10 上构建/发布与本仓库声明的
          # 最低版本不一致（见 .python-version 与 pyproject.toml）
          python-version: "3.12"

      - name: Install uv
        shell: bash
        run: python -m pip install uv

      - name: Build package
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 发布前断言 pyproject 的版本与解析出的 tag 一致：否则从任意 ref 触发都可能把
          # 不匹配（或已发布过）的版本推到 PyPI。tag 约定为 v<version>（预发布如 v4.28.0-beta.1）
          pkg_version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "v${pkg_version}" != "$TAG" ]; then
            echo "pyproject version ${pkg_version} does not match tag $TAG" >&2
            exit 1
          fi
          # Dashboard assets are already in astrbot/dashboard/dist/;
          # ASTRBOT_BUILD_DASHBOARD is intentionally unset so the hatch hook skips npm.
          uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: uv publish
