name: Smoke Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # 仓库里没有 requirements.txt（依赖以 pyproject.toml + uv.lock 为准，
          # Dockerfile 里的 requirements.txt 是构建期临时导出的），指向 uv.lock 才能命中缓存
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: |
          uv sync --frozen
        # job 上限是 10 分钟，写 15 永远不会生效（job 先被杀）；8 分钟给安装留预算，
        # 也给后面 2 分钟的冒烟留出余量
        timeout-minutes: 8

      - name: Run smoke tests
        run: |
          uv run python scripts/smoke_startup_check.py
        timeout-minutes: 2
