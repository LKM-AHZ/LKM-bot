name: Smoke Test

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # 只留 requires-python 的下限：3.10/3.11 两档在 `uv sync` 时会被项目约束
        # （requires-python >=3.12）重新选成 3.12，实测 3.10 lane 的日志是
        # "Using CPython 3.12.3 interpreter" —— 15 个 job 里有 10 个在重复跑同一个解释器。
        # 需要覆盖多版本时，应先放宽 requires-python，而不是往矩阵里堆数字。
        python-version:
          - '3.12'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # 仓库里没有 requirements.txt（依赖以 pyproject.toml + uv.lock 为准，
          # Dockerfile 里的 requirements.txt 是构建期临时导出的），指向 uv.lock 才能命中缓存
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          # 与 code-format.yml 一致地钉住 uv：uv 的解析器/lock 语义随版本变化，
          # 浮动版本会让 `uv sync --locked` 的结果取决于安装当天的最新版。
          python -m pip install "uv==0.12.12"

      - name: Install dependencies
        run: |
          uv sync --frozen
        # job 上限是 10 分钟，写 15 永远不会生效（job 先被杀）；8 分钟给安装留预算，
        # 也给后面 2 分钟的冒烟留出余量
        timeout-minutes: 8

      - name: Run smoke tests
        run: |
          uv run python scripts/smoke_startup_check.py
        timeout-minutes: 2
