# Keep GitHub Actions and app dependencies up to date.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#package-ecosystem
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # 所有 action 的更新合成一个 PR，避免每周开一堆单条升级
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    groups:
      python-deps:
        patterns: ["*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /dashboard
    groups:
      dashboard-deps:
        patterns: ["*"]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs
    groups:
      docs-deps:
        patterns: ["*"]
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
